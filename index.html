<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shantha AI + Web</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:sans-serif;background:#0f172a;color:white;display:flex;flex-direction:column;height:100dvh}
  header{background:#1e293b;padding:12px;text-align:center;font-weight:bold;font-size:18px}
  /* Website Shortcuts */
  #shortcuts{display:flex;gap:8px;padding:10px;background:#0f172a;overflow-x:auto}
  .site-btn{flex:1;min-width:90px;background:#2563eb;color:white;border:none;padding:12px 8px;border-radius:12px;font-weight:bold;font-size:14px}
  .site-btn:nth-child(2){background:#dc2626}
  .site-btn:nth-child(3){background:#16a34a}
  .site-btn:nth-child(4){background:#9333ea}
  #chat{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:85%;padding:10px 14px;border-radius:15px;line-height:1.4}
  .user{background:#2563eb;align-self:flex-end}
  .ai{background:#334155;align-self:flex-start}
  #box{display:flex;padding:10px;background:#1e293b;gap:8px;padding-bottom:18px}
  input{flex:1;padding:13px;border-radius:20px;border:none;outline:none;font-size:15px}
  button{padding:12px 18px;border:none;border-radius:20px;background:#22c55e;color:white;font-weight:bold}
</style>
</head>
<body>
<header>🤖 Shantha AI + Web</header>

<!-- WEBSITE SHORTCUT - මෙතන ඔයාගේ Site Link දාන්න -->
<div id="shortcuts">
  <button class="site-btn" onclick="openSite('https://www.google.com')">🔍 Google</button>
  <button class="site-btn" onclick="openSite('https://www.youtube.com')">▶️ YouTube</button>
  <button class="site-btn" onclick="openSite('https://www.facebook.com')">📘 Facebook</button>
  <button class="site-btn" onclick="openSite('https://github.com')">💻 GitHub</button>
</div>

<div id="chat">
  <div class="msg ai">Haloo! 🙋 මම Shantha AI. උඩින් තියෙන Button එකකින් Website එකකට යන්න, නැත්තම් මෙතන Chat කරන්න.</div>
</div>

<div id="box">
  <input id="input" placeholder="මෙතන Type කරන්න...">
  <button onclick="send()">Send</button>
</div>

<script>
function openSite(url){ window.open(url, '_blank'); }

function send(){
  let inp = document.getElementById('input');
  let text = inp.value.trim();
  if(!text) return;
  addMsg(text, 'user');
  inp.value = '';
  setTimeout(()=>{
    addMsg(getReply(text.toLowerCase()), 'ai');
  }, 400);
}
function addMsg(t, cls){
  let d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.innerText = t;
  document.getElementById('chat').appendChild(d);
  document.getElementById('chat').scrollTop = 999999;
}
function getReply(t){
  if(t.includes('haloo') || t.includes('halo') || t.includes('hello') || t.includes('hi') || t.includes('hey') || t.includes('oy') || t.includes('ko')) return 'Haloo! 🙋 කොහොමද? මොකක්ද ඕන?';
  if(t.includes('kohomada') || t.includes('hodada')) return 'මම හොඳින්! ඔයා කොහොමද?';
  if(t.includes('app')) return 'මේ App එකෙන්ම Website එකටයි Chat එකටයි දෙකටම යන්න පුළුවන්.';
  if(t.includes('site') || t.includes('web')) return 'උඩින් තියෙන Button එකක් Click කරන්න, ඒ Website එක Open වෙයි.';
  if(t.includes('thanks') || t.includes('thank')) return 'Welcome! ❤️';
  if(t.includes('bye')) return 'Bye! ආයේ එන්න 👋';
  if(t.includes('nama') || t.includes('name')) return 'මගේ නම Shantha AI. ඔයාගේ නම මොකක්ද?';
  return 'ආහ්, ඒක ගැන තව ටිකක් පැහැදිලිව කියන්න.';
}
document.getElementById('input').addEventListener('keydown', e=>{ if(e.key==='Enter') send(); });
</script>
</body>
</html>
